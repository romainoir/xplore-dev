<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapLibre - V4 True Cast Shadows (Mapterhorn 512px HD)</title>

    <script src="https://unpkg.com/maplibre-gl@4.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.x/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #000;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        #panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 300px;
            background: rgba(15, 17, 21, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            color: #fff;
        }

        h3 {
            margin: 0 0 5px 0;
            font-size: 1.2em;
            color: #4dabf7;
        }

        .subtitle {
            font-size: 0.75em;
            color: #888;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85em;
            color: #ccc;
            margin-bottom: 8px;
        }

        .val-display {
            float: right;
            color: #fff;
            font-weight: 600;
        }

        input[type="date"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            box-sizing: border-box;
            color-scheme: dark;
            font-family: inherit;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            margin-top: 5px;
            accent-color: #4dabf7;
        }

        #sun-info {
            font-size: 0.85em;
            color: #aaa;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div id="panel">
        <h3>☀️ Cast Shadows Engine</h3>
        <div class="subtitle">Mapterhorn Natif 512px WebP</div>

        <div class="control-group">
            <label for="date-input">Date</label>
            <input type="date" id="date-input">
        </div>
        <div class="control-group">
            <label>Heure (Locale) : <span class="val-display" id="time-val">08:30</span></label>
            <input type="range" id="time-input" min="0" max="23.9" step="0.1" value="8.5">
        </div>
        <div id="sun-info">Initialisation du système...</div>
    </div>

    <div id="map"></div>

    <script id="worker-script" type="javascript/worker">
    const tileCache = new Map();
    const pendingFetches = new Map();
    const abortFlags = new Set();
    
    // NOUVEAU : Canvas 512x512 pour décoder le format WebP Mapterhorn
    const decodeCanvas = new OffscreenCanvas(512, 512);
    const decodeCtx = decodeCanvas.getContext('2d', { willReadFrequently: true });

    async function getDEMTile(z, x, y, exaggeration) {
        const maxTile = (1 << z) - 1;
        if (y < 0 || y > maxTile) return null;
        const wX = ((x % (maxTile + 1)) + (maxTile + 1)) % (maxTile + 1); 
        
        const key = `${z}/${wX}/${y}`;
        if (tileCache.has(key)) return tileCache.get(key);
        if (pendingFetches.has(key)) return await pendingFetches.get(key); 
        
        const promise = (async () => {
            try {
                // Utilisation de Mapterhorn en WebP
                const res = await fetch(`https://tiles.mapterhorn.com/${z}/${wX}/${y}.webp`);
                if (!res.ok) return null;
                const blob = await res.blob();
                const bitmap = await createImageBitmap(blob);
                
                decodeCtx.drawImage(bitmap, 0, 0);
                const data = decodeCtx.getImageData(0, 0, 512, 512).data;
                
                // Tableau de 262 144 élévations (512x512)
                const elev = new Float32Array(262144);
                let maxElev = -32768;
                for (let i = 0; i < 262144; i++) {
                    const h = ((data[i*4]*256 + data[i*4+1] + data[i*4+2]/256) - 32768) * exaggeration;
                    elev[i] = h;
                    if (h > maxElev) maxElev = h;
                }
                return { elev, maxElev };
            } catch (e) { return null; }
        })();
        
        pendingFetches.set(key, promise);
        const result = await promise;
        pendingFetches.delete(key);
        if (result) {
            tileCache.set(key, result);
            if (tileCache.size > 100) tileCache.delete(tileCache.keys().next().value); // Cache réduit pour épargner la RAM
        }
        return result;
    }

    async function loadDirectionalGrid(z, x, y, dx_ray, dy_ray, exaggeration) {
        const startX = dx_ray > 0 ? x : x - 1;
        const startY = dy_ray > 0 ? y : y - 1;
        
        // Grille géante 2x2 tuiles de 512px = 1024x1024 = 1.048.576 pixels
        const grid = new Float32Array(1024 * 1024).fill(-32768);
        let maxElev = -32768;
        const promises = [];
        
        for (let dy = 0; dy < 2; dy++) {
            for (let dx = 0; dx < 2; dx++) {
                promises.push(getDEMTile(z, startX + dx, startY + dy, exaggeration).then(t => {
                    if (!t) return;
                    if (t.maxElev > maxElev) maxElev = t.maxElev;
                    for (let r = 0; r < 512; r++) grid.set(t.elev.subarray(r * 512, r * 512 + 512), (dy * 512 + r) * 1024 + (dx * 512));
                }));
            }
        }
        await Promise.all(promises);
        return { grid, maxElev, gX_min: startX / Math.pow(2, z), gY_min: startY / Math.pow(2, z), px_per_g: Math.pow(2, z) * 512 };
    }

    self.onmessage = async (e) => {
        if (e.data.cmd === 'abort') {
            abortFlags.add(e.data.id);
            return;
        }

        const { id, z, x, y, az, alt, exaggeration } = e.data;

        try {
            if (alt <= 0 || z < 8) { 
                const canvas = new OffscreenCanvas(512, 512);
                if (alt <= 0) { 
                    canvas.getContext('2d').fillStyle = 'rgba(10, 14, 25, 0.85)'; 
                    canvas.getContext('2d').fillRect(0, 0, 512, 512); 
                }
                const blob = await canvas.convertToBlob({ type: 'image/png' });
                const buffer = await blob.arrayBuffer();
                return self.postMessage({ id, buffer }, [buffer]);
            }

            const dx_ray = -Math.sin(az);
            const dy_ray = Math.cos(az);
            
            const local = await loadDirectionalGrid(z, x, y, dx_ray, dy_ray, exaggeration);
            if (abortFlags.has(id)) { abortFlags.delete(id); return; }

            let coarse = null;
            if (z >= 10) { 
                const z_coarse = z - 4;
                const scale = 1 << 4;
                coarse = await loadDirectionalGrid(z_coarse, Math.floor(x / scale), Math.floor(y / scale), dx_ray, dy_ray, exaggeration);
            }
            if (abortFlags.has(id)) { abortFlags.delete(id); return; }

            const globalMaxElev = Math.max(local.maxElev, coarse ? coarse.maxElev : -32768);

            const n = Math.PI - 2.0 * Math.PI * (y + 0.5) / Math.pow(2, z);
            const lat = Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
            const M_PER_GLOBAL_UNIT = 2 * Math.PI * 6378137 * Math.cos(lat); 
            // La Résolution passe en 512 (Deux fois plus précise qu'avant)
            const local_res = M_PER_GLOBAL_UNIT / (512 * Math.pow(2, z)); 
            
            const tanAlt = Math.max(0.001, Math.tan(alt));
            const MAX_DIST = 60000; 
            
            // Les pas ont été ajustés pour absorber la charge de la HD
            const STEP_NEAR = Math.max(local_res * 2.0, 10.0);  
            const STEP_MED  = Math.max(local_res * 8.0, 60.0); 
            const STEP_FAR  = Math.max(local_res * 20.0, 180.0);

            const outData = new Uint8ClampedArray(512 * 512 * 4);
            const dx_g = dx_ray / M_PER_GLOBAL_UNIT;
            const dy_g = dy_ray / M_PER_GLOBAL_UNIT;

            // Rendu Natif 512x512
            for (let py = 0; py < 512; py++) {
                if (py % 64 === 0 && abortFlags.has(id)) { abortFlags.delete(id); return; }

                for (let px = 0; px < 512; px++) {
                    const gX0 = (x + (px + 0.5) / 512) / Math.pow(2, z);
                    const gY0 = (y + (py + 0.5) / 512) / Math.pow(2, z);
                    
                    // L'opérateur "| 0" est utilisé ici pour de l'entier hyper-rapide (V8 Engine)
                    const s_ix = (gX0 - local.gX_min) * local.px_per_g | 0;
                    const s_iy = (gY0 - local.gY_min) * local.px_per_g | 0;
                    
                    if (s_ix < 0 || s_ix >= 1024 || s_iy < 0 || s_iy >= 1024) continue;
                    
                    const baseElev = local.grid[s_iy * 1024 + s_ix];
                    if (baseElev === -32768) continue;
                    
                    const max_search_dist = Math.min(MAX_DIST, (globalMaxElev - baseElev) / tanAlt);
                    if (max_search_dist <= 0) continue; 
                    
                    let inShadow = false;
                    let hitDist = 0;
                    let d_m = local_res * 2.0; 
                    
                    while (d_m < max_search_dist) {
                        let step_m = STEP_NEAR;
                        if (d_m > 3000) step_m = STEP_FAR;
                        else if (d_m > 600) step_m = STEP_MED;

                        d_m += step_m;
                        const drop = (d_m * d_m) / 14860000;
                        const cz = baseElev + 2 + d_m * tanAlt + drop;

                        if (cz > globalMaxElev) break; 

                        const gX = gX0 + dx_g * d_m;
                        const gY = gY0 + dy_g * d_m;

                        const ixL = (gX - local.gX_min) * local.px_per_g | 0;
                        const iyL = (gY - local.gY_min) * local.px_per_g | 0;

                        if (ixL >= 0 && ixL < 1024 && iyL >= 0 && iyL < 1024) {
                            if (local.grid[iyL * 1024 + ixL] > cz) { inShadow = true; hitDist = d_m; break; }
                        } else if (coarse) {
                            const ixM = (gX - coarse.gX_min) * coarse.px_per_g | 0;
                            const iyM = (gY - coarse.gY_min) * coarse.px_per_g | 0;
                            if (ixM >= 0 && ixM < 1024 && iyM >= 0 && iyM < 1024) {
                                if (coarse.grid[iyM * 1024 + ixM] > cz) { inShadow = true; hitDist = d_m; break; }
                            } else break; 
                        } else break;
                    }
                    
                    if (inShadow) {
                        const fade = Math.max(0.15, 1.0 - (hitDist / MAX_DIST));
                        const alpha = Math.floor(210 * fade); 
                        const idx = (py * 512 + px) * 4;
                        outData[idx] = 10; outData[idx+1] = 12; outData[idx+2] = 20; outData[idx+3] = alpha; 
                    }
                }
            }
            
            const blurData = new Uint8ClampedArray(512 * 512 * 4);
            for (let py = 0; py < 512; py++) {
                for (let px = 0; px < 512; px++) {
                    let a = 0, count = 0;
                    for (let ky = -1; ky <= 1; ky++) {
                        const ny = py + ky;
                        if (ny < 0 || ny > 511) continue;
                        for (let kx = -1; kx <= 1; kx++) {
                            const nx = px + kx;
                            if (nx >= 0 && nx <= 511) {
                                a += outData[(ny * 512 + nx) * 4 + 3];
                                count++;
                            }
                        }
                    }
                    const idx = (py * 512 + px) * 4;
                    blurData[idx] = 10; blurData[idx+1] = 12; blurData[idx+2] = 20; blurData[idx+3] = Math.floor(a / count);
                }
            }

            const canvas = new OffscreenCanvas(512, 512);
            canvas.getContext('2d').putImageData(new ImageData(blurData, 512, 512), 0, 0);

            const blob = await canvas.convertToBlob({ type: 'image/png' });
            const buffer = await blob.arrayBuffer();
            if (!abortFlags.has(id)) self.postMessage({ id, buffer }, [buffer]);

        } catch (err) {
            const canvas = new OffscreenCanvas(512, 512);
            const blob = await canvas.convertToBlob({ type: 'image/png' });
            const buffer = await blob.arrayBuffer();
            if (!abortFlags.has(id)) self.postMessage({ id, buffer }, [buffer]);
        }
        
        abortFlags.delete(id);
    };
</script>

    <script>
        const EXAGGERATION = 1.3;

        const workerBlob = new Blob([document.getElementById('worker-script').textContent], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(workerBlob);
        const worker = new Worker(workerUrl);

        const pendingRequests = new Map();
        let msgId = 0;

        worker.onmessage = (e) => {
            if (pendingRequests.has(e.data.id)) {
                pendingRequests.get(e.data.id)(e.data.buffer);
                pendingRequests.delete(e.data.id);
            }
        };

        maplibregl.addProtocol('shadow', (params, abortController) => {
            const id = msgId++;

            return new Promise((resolve) => {
                const url = new URL(params.url.replace('shadow://', 'http://mock/'));
                const parts = url.pathname.split('/').filter(Boolean);
                if (parts.length < 3) return resolve({ data: null });

                pendingRequests.set(id, (buffer) => {
                    resolve({ data: buffer });
                });

                worker.postMessage({
                    id, z: parseInt(parts[0]), x: parseInt(parts[1]), y: parseInt(parts[2]),
                    az: parseFloat(url.searchParams.get('az')), alt: parseFloat(url.searchParams.get('alt')), exaggeration: parseFloat(url.searchParams.get('ex'))
                });

                if (abortController) {
                    abortController.signal.addEventListener('abort', () => {
                        pendingRequests.delete(id);
                        worker.postMessage({ cmd: 'abort', id });
                        resolve({ data: null });
                    });
                }
            });
        });

        const map = new maplibregl.Map({
            container: 'map',
            center: [6.18, 45.85],
            zoom: 13, pitch: 70, bearing: 140, antialias: true,
            style: {
                version: 8,
                sources: {
                    'satellite': { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, maxzoom: 19 },

                    // --- INTÉGRATION MAPTERHORN 512px ---
                    'terrain-source': {
                        type: 'raster-dem',
                        tiles: ['https://tiles.mapterhorn.com/{z}/{x}/{y}.webp'],
                        encoding: 'terrarium',
                        tileSize: 512, // Indispensable pour que le relief 3D soit correctement dimensionné !
                        maxzoom: 15 // Mapterhorn supporte un zoom plus profond
                    }
                },
                layers: [{ id: 'satellite-layer', type: 'raster', source: 'satellite' }]
            }
        });

        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

        map.on('load', () => {
            map.setTerrain({ source: 'terrain-source', exaggeration: EXAGGERATION });

            map.addLayer({
                id: 'hillshade-layer', type: 'hillshade', source: 'terrain-source',
                paint: {
                    'hillshade-shadow-color': 'rgba(20, 20, 30, 0.25)',
                    'hillshade-highlight-color': 'rgba(255, 255, 255, 0.4)',
                    'hillshade-exaggeration': Math.min(1, EXAGGERATION)
                }
            });

            // La couche d'ombres est désormais calculée et tuilée en 512x512
            map.addSource('cast-shadows-source', {
                type: 'raster',
                tiles: [`shadow://{z}/{x}/{y}?az=0&alt=1&ex=${EXAGGERATION}&ts=0`],
                tileSize: 512,
                maxzoom: 15
            });

            map.addLayer({
                id: 'cast-shadows-layer', type: 'raster', source: 'cast-shadows-source',
                paint: {
                    'raster-opacity': 0.85,
                    'raster-fade-duration': 0,
                    'raster-resampling': 'linear'
                }
            });

            updateShadows();
        });

        const dateInput = document.getElementById('date-input');
        const timeInput = document.getElementById('time-input');

        const now = new Date();
        dateInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        let debounceTimer;

        function getSunPosUI() {
            const dateStr = dateInput.value;
            const timeVal = parseFloat(timeInput.value);
            if (!dateStr) return null;

            const h = Math.floor(timeVal);
            const m = Math.floor((timeVal - h) * 60);
            document.getElementById('time-val').innerText = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;

            const parts = dateStr.split('-');
            const dateObj = new Date(parts[0], parts[1] - 1, parts[2], h, m, 0);

            const center = map.getCenter();
            const sunPos = SunCalc.getPosition(dateObj, center.lat, center.lng);

            document.getElementById('sun-info').innerHTML = `Altitude du Soleil : <strong>${(sunPos.altitude * 180 / Math.PI).toFixed(1)}°</strong>`;
            return sunPos;
        }

        getSunPosUI();

        function updateShadows() {
            const source = map.getSource('cast-shadows-source');
            if (!source) return;

            const sunPos = getSunPosUI();
            if (!sunPos) return;

            const maplibreAzimuth = (sunPos.azimuth * 180 / Math.PI + 180) % 360;
            if (map.getLayer('hillshade-layer')) {
                map.setPaintProperty('hillshade-layer', 'hillshade-illumination-direction', maplibreAzimuth);
                if (sunPos.altitude * 180 / Math.PI < 15) {
                    map.setPaintProperty('hillshade-layer', 'hillshade-highlight-color', '#ffcca3');
                } else {
                    map.setPaintProperty('hillshade-layer', 'hillshade-highlight-color', '#ffffff');
                }
            }

            const shadowUrl = `shadow://{z}/{x}/{y}?az=${sunPos.azimuth.toFixed(4)}&alt=${sunPos.altitude.toFixed(4)}&ex=${EXAGGERATION}&ts=${Date.now()}`;
            source.setTiles([shadowUrl]);
        }

        timeInput.addEventListener('input', () => {
            getSunPosUI();
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(updateShadows, 80);
        });
        dateInput.addEventListener('input', updateShadows);
    </script>
</body>

</html>
