<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Debug POC - refactor 20260427</title>
    <link href="maplibre-gl-js-5.18.0/src/css/maplibre-gl.css" rel="stylesheet">
    <script src="scripts/map/maplibre-gl-dev.js?v=20260430-sun-window-black-mask-2"></script>
    <style>
        :root {
            color-scheme: dark;
            --panel-bg: rgba(13, 16, 20, 0.86);
            --panel-border: rgba(255, 255, 255, 0.14);
            --text: #f5f7fb;
            --muted: #b5bfca;
            --blue: #4dabf7;
            --amber: #f1c40f;
            --red: #ff6b6b;
            --green: #2ecc71;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        #map {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #f5f7fb;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
        }

        #map {
            position: absolute;
            inset: 0;
            background: #f5f7fb;
        }

        .panel {
            position: absolute;
            z-index: 1000;
            width: min(320px, calc(100vw - 20px));
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(8px);
        }

        #controls {
            top: 10px;
            left: 10px;
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            padding: 14px;
        }

        #controls-bottom {
            right: 10px;
            bottom: 30px;
            padding: 12px;
        }

        h3 {
            margin: 0 0 12px;
            font-size: 16px;
            line-height: 1.2;
        }

        .row {
            margin-bottom: 10px;
        }

        .section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--blue);
            font-weight: 700;
        }

        .section.penumbra {
            color: #bd8cff;
        }

        .section.alpha {
            color: var(--amber);
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.25;
        }

        .value {
            color: var(--text);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--blue);
        }

        input[type="date"],
        select {
            width: 100%;
            padding: 6px 8px;
            color: var(--text);
            background: rgba(0, 0, 0, 0.38);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            font: inherit;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 30px;
        }

        .toggle-row input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .toggle-row label {
            margin: 0;
            cursor: pointer;
        }

        button {
            width: 100%;
            min-height: 34px;
            border: 0;
            border-radius: 5px;
            color: #fff;
            font: 700 12px/1.2 inherit;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .reload-button {
            margin-top: 10px;
            background: var(--blue);
        }

        .atlas-button {
            margin-top: 10px;
            color: #121212;
            background: var(--amber);
        }

        .close-button {
            margin-top: 10px;
            background: #e74c3c;
        }

        .copy-debug-button {
            position: sticky;
            bottom: 0;
            margin-top: 10px;
            background: #34495e;
        }

        #status-panel {
            left: 10px;
            bottom: 10px;
            width: min(440px, calc(100vw - 20px));
            padding: 8px 10px;
            color: #d7e0ea;
            font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            pointer-events: none;
        }

        #fps-counter {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 99999;
            min-width: 150px;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.85);
            color: var(--green);
            font: 700 16px/1.18 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            text-align: center;
            white-space: pre;
            pointer-events: none;
        }

        #tile-debug-panel {
            display: none;
            top: 72px;
            right: 10px;
            width: min(390px, calc(100vw - 20px));
            max-height: min(390px, calc(100vh - 92px));
            padding: 10px 12px;
            overflow: auto;
            pointer-events: auto;
            user-select: text;
            -webkit-user-select: text;
        }

        #tile-debug-panel h3 {
            margin-bottom: 8px;
            color: var(--amber);
            font-size: 14px;
        }

        #tile-log {
            margin: 0;
            min-height: 180px;
            overflow: visible;
            color: #d7e0ea;
            font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            white-space: pre;
            cursor: text;
            user-select: text;
            -webkit-user-select: text;
        }

        #atlas-debug-overlay {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2000;
            width: min(430px, calc(100vw - 20px));
            padding: 15px;
            background: rgba(8, 10, 14, 0.94);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
        }

        #atlas-debug-overlay h3 {
            color: var(--amber);
        }

        #atlas-debug-overlay p {
            margin: -4px 0 10px;
            color: #aab3bd;
            font-size: 12px;
            line-height: 1.35;
        }

        .atlas-canvas-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #20242c;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 4px;
        }

        #atlas-canvas,
        #atlas-overlay-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #atlas-overlay-canvas {
            pointer-events: none;
        }

        @media (max-width: 760px) {
            body {
                overflow: auto;
            }

            #map {
                position: fixed;
            }

            #controls,
            #controls-bottom,
            #status-panel,
            #tile-debug-panel,
            #atlas-debug-overlay {
                position: relative;
                top: auto;
                right: auto;
                bottom: auto;
                left: auto;
                width: calc(100vw - 20px);
                margin: 10px;
            }

            #controls {
                max-height: none;
            }

            #fps-counter {
                top: 10px;
                right: 10px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <section id="controls" class="panel" aria-label="Shadow debugger controls">
        <h3>Shadow Debugger</h3>

        <div class="row">
            <label for="date-input">Date</label>
            <input type="date" id="date-input">
        </div>
        <div class="row">
            <label for="time-input">Time: <span class="value" id="time-val">08:30</span></label>
            <input type="range" id="time-input" min="0" max="1435" step="5" value="510">
        </div>

        <div class="row section">
            <label>Sun Azimuth: <span class="value" id="azimuth-val">...</span> deg</label>
            <label>Sun Altitude: <span class="value" id="altitude-val">...</span> deg</label>
        </div>
    </section>

    <section id="controls-bottom" class="panel" aria-label="Layer controls">
        <label style="color:#fff;font-weight:700;margin-bottom:8px;">Layer Controls</label>

        <div class="toggle-row">
            <input type="checkbox" id="coarse-toggle" checked>
            <label for="coarse-toggle" style="color:var(--blue);">Show Global Shadows</label>
        </div>
        <div class="toggle-row">
            <input type="checkbox" id="satellite-toggle">
            <label for="satellite-toggle" style="color:#d7e0ea;">Show Esri Satellite</label>
        </div>
        <div class="toggle-row">
            <input type="checkbox" id="daylight-toggle">
            <label for="daylight-toggle" style="color:var(--amber);">Show Sun Duration</label>
        </div>
        <div class="toggle-row">
            <input type="checkbox" id="tile-log-toggle">
            <label for="tile-log-toggle" style="color:#d7e0ea;">Show Tile/FPS Log</label>
        </div>

        <div class="row section">
            <label for="horizon-quality">Shadow Quality</label>
            <select id="horizon-quality">
                <option value="fast">Fast</option>
                <option value="balanced" selected>Balanced</option>
                <option value="high">High</option>
            </select>
        </div>
        <div class="row">
            <label for="edge-softness">Edge Softness: <span class="value" id="edge-softness-val">1.00</span></label>
            <input type="range" id="edge-softness" min="0.5" max="1.8" step="0.05" value="1">
        </div>
        <div class="row">
            <label for="edge-naturalness">Edge Dither: <span class="value" id="edge-naturalness-val">0.00</span></label>
            <input type="range" id="edge-naturalness" min="0" max="1.2" step="0.02" value="0">
        </div>

        <button id="reload-btn" class="reload-button">Hard Reload Page</button>
        <button id="show-atlas-btn" class="atlas-button">Show Internal Elevation Atlas</button>
    </section>

    <section id="status-panel" class="panel" aria-live="polite">Loading custom MapLibre build...</section>
    <div id="fps-counter">-- FPS</div>
    <section id="tile-debug-panel" class="panel" aria-label="Tile performance debug">
        <h3>Tile/FPS Debug</h3>
        <pre id="tile-log">Waiting for tile stats...</pre>
        <button id="copy-tile-log-btn" class="copy-debug-button">Copy Debug Text</button>
    </section>

    <section id="atlas-debug-overlay" aria-label="Elevation atlas debug overlay">
        <h3>Elevation Atlas</h3>
        <p id="atlas-status">Waiting for atlas metadata.</p>
        <div class="atlas-canvas-wrap">
            <canvas id="atlas-canvas" width="2048" height="2048"></canvas>
            <canvas id="atlas-overlay-canvas" width="400" height="400"></canvas>
        </div>
        <button id="close-atlas-btn" class="close-button">Close Overlay</button>
    </section>

    <script>
        (() => {
            'use strict';

            const MAPTERHORN_TILE_URL = 'https://tiles.mapterhorn.com/{z}/{x}/{y}.webp';
            const ESRI_WORLD_IMAGERY_TILE_URL = 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
            const DEFAULT_CENTER = [6.18, 45.85];
            const DEFAULT_ZOOM = 12.5;
            const DEFAULT_PITCH = 65;
            const DEFAULT_BEARING = -40;
            const TERRAIN_EXAGGERATION = 1.3;
            const SHADOW_MIN_RENDER_ALTITUDE = 2;
            const SHADOW_MAX_RENDER_ALTITUDE = 89.9;
            const ATLAS_REFRESH_MS = 1500;
            const TILE_DEBUG_PANEL_REFRESH_MS = 1000;
            const TIME_PREVIEW_THROTTLE_MS = 360;
            const CAMERA_SHADOW_SETTLE_MS = 450;
            const CAMERA_SHADOW_FINE_DELAY_MS = 1200;
            const CAMERA_SHADOW_IDLE_TIMEOUT_MS = 1800;
            const USE_TRANSPARENT_HILLSHADE_CACHE = true;

            const dom = {
                map: document.getElementById('map'),
                status: document.getElementById('status-panel'),
                fps: document.getElementById('fps-counter'),
                date: document.getElementById('date-input'),
                time: document.getElementById('time-input'),
                timeVal: document.getElementById('time-val'),
                azimuthVal: document.getElementById('azimuth-val'),
                altitudeVal: document.getElementById('altitude-val'),
                coarseToggle: document.getElementById('coarse-toggle'),
                satelliteToggle: document.getElementById('satellite-toggle'),
                daylightToggle: document.getElementById('daylight-toggle'),
                tileLogToggle: document.getElementById('tile-log-toggle'),
                horizonQuality: document.getElementById('horizon-quality'),
                edgeSoftness: document.getElementById('edge-softness'),
                edgeSoftnessVal: document.getElementById('edge-softness-val'),
                edgeNaturalness: document.getElementById('edge-naturalness'),
                edgeNaturalnessVal: document.getElementById('edge-naturalness-val'),
                reload: document.getElementById('reload-btn'),
                showAtlas: document.getElementById('show-atlas-btn'),
                closeAtlas: document.getElementById('close-atlas-btn'),
                atlasOverlay: document.getElementById('atlas-debug-overlay'),
                atlasStatus: document.getElementById('atlas-status'),
                atlasCanvas: document.getElementById('atlas-canvas'),
                atlasOverlayCanvas: document.getElementById('atlas-overlay-canvas'),
                tileDebugPanel: document.getElementById('tile-debug-panel'),
                tileLog: document.getElementById('tile-log'),
                copyTileLog: document.getElementById('copy-tile-log-btn'),
            };

            const state = {
                map: null,
                atlasTimer: null,
                lastSunUpdateAt: 0,
                interactionTimer: null,
                previewTimer: null,
                tileErrorCount: 0,
                tileDebugEnabled: false,
                layersInstalled: false,
                layerInstallAttempts: 0,
                lastAtlasTimestamp: 0,
                lastAtlasPixelsTimestamp: 0,
                lastTilePanelUpdateAt: 0,
                lastTileConsoleLogAt: 0,
                lastFpsStats: null,
                lastTileDebugText: '',
                lastTileDebugSnapshot: null,
                lastTileDebugUiMs: 0,
                lastFrameGapMs: 0,
                cameraMoving: false,
                cameraShadowDeferred: false,
                cameraShadowRefreshHold: false,
                cameraShadowRefreshTimer: null,
                cameraShadowIdleTimer: null,
                cameraShadowFullTimer: null,
                cameraShadowIdleRelease: null,
                cameraShadowPreviewActive: false,
                longTasks: [],
                longTaskObserver: null,
                longTaskObserverInstalled: false,
                offscreenAtlasCanvas: document.createElement('canvas'),
            };

            window._shadowTileDebugEnabled = false;
            window._castShadowMult = 1.45;
            window._selfShadowMult = 1.0;
            window._terrainNativeDemZoom = true;
            window._horizonQualityPreset = 'balanced';
            window._horizonDirectionBins = 16;
            window._horizonEdgeSoftness = 1.0;
            window._horizonEdgeNaturalness = 0.0;
            const HORIZON_UI_PRESETS = {
                fast: { bins: 8, edgeSoftness: 1.10, edgeNaturalness: 0.00 },
                balanced: { bins: 16, edgeSoftness: 1.00, edgeNaturalness: 0.00 },
                high: { bins: 16, edgeSoftness: 0.85, edgeNaturalness: 0.00 }
            };
            const rangeBindings = [];

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function smoothstep(edge0, edge1, value) {
                const t = clamp((value - edge0) / (edge1 - edge0), 0, 1);
                return t * t * (3 - 2 * t);
            }

            function mixNumber(a, b, t) {
                return a * (1 - t) + b * t;
            }

            function rgbString(rgb) {
                return `rgb(${Math.round(rgb[0])}, ${Math.round(rgb[1])}, ${Math.round(rgb[2])})`;
            }

            function setStatus(message, tone = 'info') {
                dom.status.textContent = message;
                dom.status.style.color = tone === 'error' ? '#ffb3b3' : tone === 'warn' ? '#ffe08a' : '#d7e0ea';
            }

            function getErrorMessage(errorLike) {
                if (!errorLike) return 'Unknown error';
                if (errorLike.error) return getErrorMessage(errorLike.error);
                if (errorLike.message) return errorLike.message;
                if (typeof errorLike === 'string') return errorLike;
                return String(errorLike);
            }

            function todayForDateInput() {
                const now = new Date();
                return [
                    now.getFullYear(),
                    String(now.getMonth() + 1).padStart(2, '0'),
                    String(now.getDate()).padStart(2, '0')
                ].join('-');
            }

            function minutesToLabel(totalMinutes) {
                const minutes = clamp(Number.parseInt(totalMinutes, 10) || 0, 0, 1435);
                const hours = Math.floor(minutes / 60);
                const mins = minutes % 60;
                return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
            }

            function getSelectedDateTime() {
                const dateParts = dom.date.value.split('-').map(part => Number.parseInt(part, 10));
                if (dateParts.length !== 3 || dateParts.some(part => !Number.isFinite(part))) {
                    return null;
                }

                const minutes = clamp(Number.parseInt(dom.time.value, 10) || 0, 0, 1435);
                return new Date(dateParts[0], dateParts[1] - 1, dateParts[2], Math.floor(minutes / 60), minutes % 60, 0);
            }

            const solar = (() => {
                const PI = Math.PI;
                const rad = PI / 180;
                const dayMs = 86400000;
                const J1970 = 2440588;
                const J2000 = 2451545;
                const obliquity = rad * 23.4397;

                const toJulian = date => date.valueOf() / dayMs - 0.5 + J1970;
                const toDays = date => toJulian(date) - J2000;
                const rightAscension = (longitude, latitude) => Math.atan2(
                    Math.sin(longitude) * Math.cos(obliquity) - Math.tan(latitude) * Math.sin(obliquity),
                    Math.cos(longitude)
                );
                const declination = (longitude, latitude) => Math.asin(
                    Math.sin(latitude) * Math.cos(obliquity) +
                    Math.cos(latitude) * Math.sin(obliquity) * Math.sin(longitude)
                );
                const azimuth = (hourAngle, latitude, declinationValue) => Math.atan2(
                    Math.sin(hourAngle),
                    Math.cos(hourAngle) * Math.sin(latitude) - Math.tan(declinationValue) * Math.cos(latitude)
                );
                const altitude = (hourAngle, latitude, declinationValue) => Math.asin(
                    Math.sin(latitude) * Math.sin(declinationValue) +
                    Math.cos(latitude) * Math.cos(declinationValue) * Math.cos(hourAngle)
                );
                const siderealTime = (days, lw) => rad * (280.16 + 360.9856235 * days) - lw;
                const solarMeanAnomaly = days => rad * (357.5291 + 0.98560028 * days);
                const eclipticLongitude = meanAnomaly => {
                    const center = rad * (
                        1.9148 * Math.sin(meanAnomaly) +
                        0.02 * Math.sin(2 * meanAnomaly) +
                        0.0003 * Math.sin(3 * meanAnomaly)
                    );
                    return meanAnomaly + center + rad * 102.9372 + PI;
                };
                const sunCoords = days => {
                    const meanAnomaly = solarMeanAnomaly(days);
                    const longitude = eclipticLongitude(meanAnomaly);
                    return {
                        dec: declination(longitude, 0),
                        ra: rightAscension(longitude, 0)
                    };
                };

                return {
                    getPosition(date, lat, lng) {
                        const lw = rad * -lng;
                        const phi = rad * lat;
                        const days = toDays(date);
                        const coords = sunCoords(days);
                        const hourAngle = siderealTime(days, lw) - coords.ra;
                        return {
                            azimuth: azimuth(hourAngle, phi, coords.dec),
                            altitude: altitude(hourAngle, phi, coords.dec)
                        };
                    }
                };
            })();

            function computeSun(date, center) {
                const sunPos = solar.getPosition(date, center.lat, center.lng);
                return {
                    azimuth: (sunPos.azimuth * 180 / Math.PI + 180) % 360,
                    altitude: sunPos.altitude * 180 / Math.PI
                };
            }

            function colorRampForSun(altitude) {
                const altitudeRad = altitude * Math.PI / 180;
                const directSun = smoothstep(-2.0, 8.0, altitude);
                const skyAmbient = smoothstep(-16.0, 6.0, altitude);
                const horizonWarmth = smoothstep(-6.0, 2.0, altitude) * (1.0 - smoothstep(6.0, 16.0, altitude));
                const sunMix = clamp((0.52 - altitudeRad) / (0.52 - 0.08), 0, 1);
                const highlight = {
                    r: 255,
                    g: Math.round((0.97 * (1 - sunMix) + 0.76 * sunMix) * 255),
                    b: Math.round((0.92 - 0.50 * sunMix) * 255)
                };
                const shadow = {
                    r: Math.round((0.07 + 0.11 * sunMix) * 255),
                    g: Math.round((0.26 * (1 - sunMix) + 0.10 * sunMix) * 255),
                    b: Math.round((0.44 * (1 - sunMix) + 0.34 * sunMix) * 255)
                };
                const hillshadeHighlightRgb = [
                    mixNumber(170, mixNumber(255, 255, horizonWarmth), skyAmbient),
                    mixNumber(190, mixNumber(180, 248, directSun), skyAmbient),
                    mixNumber(220, mixNumber(130, 255, directSun), skyAmbient)
                ];
                const hillshadeShadowOpacity = mixNumber(0.11, 0.26, directSun) + horizonWarmth * 0.035;
                return {
                    highlight: `rgb(${highlight.r}, ${highlight.g}, ${highlight.b})`,
                    shadow: `rgb(${shadow.r}, ${shadow.g}, ${shadow.b})`,
                    directSun,
                    skyAmbient,
                    hillshadeHighlight: rgbString(hillshadeHighlightRgb),
                    hillshadeShadow: `rgba(0,0,0, ${clamp(hillshadeShadowOpacity, 0.10, 0.32).toFixed(3)})`
                };
            }

            function setLayerVisibility(layerId, visible) {
                const map = state.map;
                if (!map || !map.getLayer(layerId)) return;
                map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
                map.triggerRepaint();
            }

            function safeSetPaint(layerId, property, value) {
                const map = state.map;
                if (!map || !map.getLayer(layerId)) return;
                try {
                    map.setPaintProperty(layerId, property, value);
                } catch (error) {
                    setStatus(`${layerId}.${property}: ${getErrorMessage(error)}`, 'warn');
                }
            }

            function updateSun(forceRepaint = true) {
                const map = state.map;
                if (!map) return;

                const date = getSelectedDateTime();
                if (!date || Number.isNaN(date.getTime())) {
                    setStatus('Invalid date/time selected.', 'warn');
                    return;
                }

                dom.timeVal.textContent = minutesToLabel(dom.time.value);

                const center = map.getCenter();
                const sun = computeSun(date, center);
                const renderAltitude = clamp(sun.altitude, SHADOW_MIN_RENDER_ALTITUDE, SHADOW_MAX_RENDER_ALTITUDE);
                const colors = colorRampForSun(sun.altitude);
                const shadowOpacity = dom.coarseToggle.checked ? colors.directSun : 0.0;
                window._actualSunAltitudeRad = sun.altitude * Math.PI / 180;
                window._directSunAmount = colors.directSun;
                window._skyAmbientAmount = colors.skyAmbient;
                window._daylightDateMs = date.getTime();
                window._shadowSunDirection = [
                    Math.sin(sun.azimuth * Math.PI / 180),
                    -Math.cos(sun.azimuth * Math.PI / 180)
                ];

                dom.azimuthVal.textContent = sun.azimuth.toFixed(1);
                dom.altitudeVal.textContent = sun.altitude.toFixed(1);

                safeSetPaint('shadow-coarse', 'shadow-direction', sun.azimuth);
                safeSetPaint('shadow-coarse', 'shadow-altitude', renderAltitude);
                safeSetPaint('shadow-coarse', 'shadow-opacity', shadowOpacity);
                safeSetPaint('shadow-coarse', 'shadow-shadow-color', colors.shadow);
                safeSetPaint('shadow-coarse', 'shadow-highlight-color', colors.highlight);
                safeSetPaint('terrain-derivative-cache', 'hillshade-illumination-direction', sun.azimuth);
                safeSetPaint('terrain-derivative-cache', 'hillshade-illumination-altitude', renderAltitude);

                window.sunConfig = {
                    azimuth: sun.azimuth,
                    altitude: sun.altitude,
                    renderAltitude,
                    directSun: colors.directSun,
                    skyAmbient: colors.skyAmbient
                };

                state.lastSunUpdateAt = performance.now();
                if (forceRepaint) map.triggerRepaint();
            }

            function scheduleSunUpdate(fromInteraction = false) {
                dom.timeVal.textContent = minutesToLabel(dom.time.value);

                if (!state.map) return;
                if (!fromInteraction) {
                    requestAnimationFrame(() => updateSun(true));
                    return;
                }

                window._isInteractingWithTime = true;
                const now = performance.now();
                const elapsed = now - state.lastSunUpdateAt;
                if (elapsed > TIME_PREVIEW_THROTTLE_MS) {
                    updateSun(true);
                    return;
                }

                clearTimeout(state.previewTimer);
                state.previewTimer = window.setTimeout(() => {
                    if (window._isInteractingWithTime) updateSun(true);
                }, TIME_PREVIEW_THROTTLE_MS - elapsed);
            }

            function finishSunInteraction() {
                dom.timeVal.textContent = minutesToLabel(dom.time.value);
                if (!state.map) return;

                clearTimeout(state.previewTimer);
                clearTimeout(state.interactionTimer);
                clearCameraShadowRefreshTimers();
                state.cameraShadowDeferred = false;
                state.cameraShadowRefreshHold = false;
                state.cameraShadowPreviewActive = false;
                window._shadowCameraRefreshHold = false;
                window._shadowProgressivePhase = 'stable';
                window._isInteractingWithTime = false;
                updateSun(true);
            }

            function deferCameraShadowRefresh() {
                clearCameraShadowRefreshTimers();
                state.cameraMoving = true;
                state.cameraShadowDeferred = true;
                state.cameraShadowRefreshHold = true;
                state.cameraShadowPreviewActive = false;
                window._shadowCameraMoving = true;
                window._shadowCameraRefreshHold = true;
                window._shadowProgressivePhase = 'held';
            }

            function finishCameraShadowRefresh() {
                state.cameraMoving = false;
                window._shadowCameraMoving = false;
                if (!state.cameraShadowDeferred) return;

                state.cameraShadowRefreshHold = true;
                window._shadowCameraRefreshHold = true;
                clearCameraShadowRefreshTimers();
                state.cameraShadowRefreshTimer = window.setTimeout(waitForCameraShadowIdle, CAMERA_SHADOW_SETTLE_MS);
            }

            function clearCameraShadowRefreshTimers() {
                clearTimeout(state.cameraShadowRefreshTimer);
                clearTimeout(state.cameraShadowIdleTimer);
                clearTimeout(state.cameraShadowFullTimer);
                state.cameraShadowRefreshTimer = null;
                state.cameraShadowIdleTimer = null;
                state.cameraShadowFullTimer = null;

                if (state.cameraShadowIdleRelease && state.map && typeof state.map.off === 'function') {
                    state.map.off('idle', state.cameraShadowIdleRelease);
                }
                state.cameraShadowIdleRelease = null;
            }

            function releaseCameraShadowRefresh() {
                if (!state.cameraShadowDeferred || state.cameraMoving) return;

                clearCameraShadowRefreshTimers();
                state.cameraShadowRefreshHold = false;
                state.cameraShadowPreviewActive = true;
                window._shadowCameraRefreshHold = false;
                window._shadowProgressivePhase = 'preview';
                updateSun(true);
                state.map?.triggerRepaint();
                state.cameraShadowFullTimer = window.setTimeout(releaseCameraShadowFullRefresh, CAMERA_SHADOW_FINE_DELAY_MS);
            }

            function releaseCameraShadowFullRefresh() {
                state.cameraShadowFullTimer = null;
                if (!state.cameraShadowDeferred || state.cameraMoving) return;

                state.cameraShadowDeferred = false;
                state.cameraShadowRefreshHold = false;
                state.cameraShadowPreviewActive = false;
                window._shadowCameraRefreshHold = false;
                window._shadowProgressivePhase = 'full';
                updateSun(true);
                state.map?.triggerRepaint();
            }

            function waitForCameraShadowIdle() {
                state.cameraShadowRefreshTimer = null;
                if (!state.map || !state.cameraShadowDeferred || state.cameraMoving) return;

                const tilesReady = typeof state.map.areTilesLoaded === 'function'
                    ? state.map.areTilesLoaded()
                    : typeof state.map.loaded === 'function' ? state.map.loaded() : false;

                if (tilesReady) {
                    releaseCameraShadowRefresh();
                    return;
                }

                state.cameraShadowIdleRelease = () => releaseCameraShadowRefresh();
                state.map.once('idle', state.cameraShadowIdleRelease);
                state.cameraShadowIdleTimer = window.setTimeout(releaseCameraShadowRefresh, CAMERA_SHADOW_IDLE_TIMEOUT_MS);
            }

            function bindRangeControl(config) {
                const input = document.getElementById(config.id);
                const valueNode = document.getElementById(config.valueId);

                const apply = () => {
                    const parsed = config.parse(input.value);
                    const value = Number.isFinite(parsed) ? parsed : config.parse(input.defaultValue);
                    window[config.globalName] = value;
                    valueNode.textContent = config.format(value);
                    if (state.map) state.map.triggerRepaint();
                };

                input.addEventListener('input', apply);
                apply();
            }

            function invalidateHorizonDerivedCaches(includeHorizon) {
                const terrain = state.map?.terrain;
                if (terrain) {
                    if (includeHorizon) {
                        terrain._horizonAtlasReady = false;
                        terrain._horizonAtlasKey = null;
                    }
                    terrain._daylightAtlasReady = false;
                    terrain._daylightAtlasKey = null;
                }
                state.map?.triggerRepaint();
            }

            function applyHorizonQualityPreset(presetName) {
                const preset = HORIZON_UI_PRESETS[presetName] || HORIZON_UI_PRESETS.balanced;
                window._horizonQualityPreset = presetName in HORIZON_UI_PRESETS ? presetName : 'balanced';
                window._horizonDirectionBins = preset.bins;
                window._horizonEdgeSoftness = preset.edgeSoftness;
                window._horizonEdgeNaturalness = preset.edgeNaturalness;
                dom.edgeSoftness.value = String(preset.edgeSoftness);
                dom.edgeNaturalness.value = String(preset.edgeNaturalness);
                dom.edgeSoftnessVal.textContent = preset.edgeSoftness.toFixed(2);
                dom.edgeNaturalnessVal.textContent = preset.edgeNaturalness.toFixed(2);
                invalidateHorizonDerivedCaches(true);
            }

            function applyHorizonEdgeControls() {
                const softness = Number.parseFloat(dom.edgeSoftness.value);
                const naturalness = Number.parseFloat(dom.edgeNaturalness.value);
                window._horizonEdgeSoftness = Number.isFinite(softness) ? softness : 1.0;
                window._horizonEdgeNaturalness = Number.isFinite(naturalness) ? naturalness : 0.0;
                dom.edgeSoftnessVal.textContent = window._horizonEdgeSoftness.toFixed(2);
                dom.edgeNaturalnessVal.textContent = window._horizonEdgeNaturalness.toFixed(2);
                invalidateHorizonDerivedCaches(false);
            }

            function clearRuntimeDebugGlobals() {
                [
                    '_terrainTileDebug',
                    '_hillshadePrepareDebug',
                    '_hillshadeRenderDebug',
                    '_shadowAtlasReuseDebug',
                    '_shadowPassDebug',
                    '_shadowOffscreenDebug',
                    '_shadowCameraRefreshDebug',
                    '_horizonPrepareDebug',
                    '_daylightPrepareDebug',
                    '_daylightDebug'
                ].forEach(key => {
                    delete window[key];
                });
            }

            function setTileDebugEnabled(enabled) {
                state.tileDebugEnabled = !!enabled;
                window._shadowTileDebugEnabled = state.tileDebugEnabled;
                dom.tileDebugPanel.style.display = state.tileDebugEnabled ? 'block' : 'none';

                if (!state.tileDebugEnabled) {
                    state.lastTileDebugText = '';
                    state.lastTileDebugSnapshot = null;
                    state.lastTileDebugUiMs = 0;
                    state.longTasks.length = 0;
                    if (state.longTaskObserver) {
                        state.longTaskObserver.disconnect();
                        state.longTaskObserver = null;
                        state.longTaskObserverInstalled = false;
                    }
                    dom.tileLog.textContent = 'Tile/FPS logging is disabled.';
                    clearRuntimeDebugGlobals();
                    state.map?.triggerRepaint();
                    return;
                }

                installLongTaskObserver();
                state.lastTilePanelUpdateAt = 0;
                dom.tileLog.textContent = 'Waiting for tile stats...';
                state.map?.triggerRepaint();
                updateTileDebugPanel(state.lastFpsStats);
            }

            function installControls() {
                rangeBindings.forEach(bindRangeControl);

                dom.date.value = todayForDateInput();
                dom.timeVal.textContent = minutesToLabel(dom.time.value);

                dom.date.addEventListener('input', () => finishSunInteraction());
                dom.date.addEventListener('change', () => finishSunInteraction());
                dom.time.addEventListener('pointerdown', () => {
                    window._isInteractingWithTime = true;
                });
                dom.time.addEventListener('input', () => scheduleSunUpdate(true));
                dom.time.addEventListener('change', () => finishSunInteraction());
                dom.time.addEventListener('pointerup', () => finishSunInteraction());
                dom.time.addEventListener('keyup', event => {
                    if (event.key === 'Enter' || event.key === 'Escape') finishSunInteraction();
                });

                dom.coarseToggle.addEventListener('change', event => {
                    const visible = event.target.checked;
                    setLayerVisibility('shadow-coarse', visible);
                    safeSetPaint('shadow-coarse', 'shadow-opacity', visible ? (window.sunConfig?.directSun || 0.0) : 0.0);
                });
                dom.satelliteToggle.addEventListener('change', event => {
                    setLayerVisibility('esri-satellite', event.target.checked);
                });
                dom.daylightToggle.addEventListener('change', event => {
                    setLayerVisibility('daylight-native', event.target.checked);
                });
                dom.tileLogToggle.addEventListener('change', event => {
                    setTileDebugEnabled(event.target.checked);
                });
                setTileDebugEnabled(false);
                dom.horizonQuality.addEventListener('change', event => {
                    applyHorizonQualityPreset(event.target.value);
                });
                dom.edgeSoftness.addEventListener('input', applyHorizonEdgeControls);
                dom.edgeNaturalness.addEventListener('input', applyHorizonEdgeControls);
                applyHorizonQualityPreset(dom.horizonQuality.value);

                dom.reload.addEventListener('click', () => window.location.reload());
                dom.showAtlas.addEventListener('click', openAtlasDebug);
                dom.closeAtlas.addEventListener('click', closeAtlasDebug);
                dom.copyTileLog.addEventListener('click', copyTileDebugText);
                ['mousedown', 'touchstart', 'wheel', 'dblclick'].forEach(eventName => {
                    dom.tileDebugPanel.addEventListener(eventName, event => event.stopPropagation());
                });
            }

            function createStyle() {
                const demSource = {
                    type: 'raster-dem',
                    tiles: [MAPTERHORN_TILE_URL],
                    encoding: 'terrarium',
                    tileSize: 512,
                    maxzoom: 15,
                    attribution: '<a href="https://mapterhorn.com/attribution">© Mapterhorn</a>'
                };

                return {
                    version: 8,
                    sources: {
                        terrainSource: demSource,
                        esriWorldImagery: {
                            type: 'raster',
                            tiles: [ESRI_WORLD_IMAGERY_TILE_URL],
                            tileSize: 256,
                            maxzoom: 19,
                            attribution: 'Tiles &copy; Esri'
                        }
                    },
                    layers: [
                        {
                            id: 'background',
                            type: 'background',
                            paint: { 'background-color': '#f5f7fb' }
                        }
                    ]
                };
            }

            function safeAddLayer(layer) {
                if (state.map.getLayer(layer.id)) return true;
                try {
                    state.map.addLayer(layer);
                    return true;
                } catch (error) {
                    setStatus(`Could not add ${layer.id}: ${getErrorMessage(error)}`, 'error');
                    return false;
                }
            }

            function installLayers() {
                if (state.layersInstalled) return true;
                state.layerInstallAttempts += 1;

                const map = state.map;

                try {
                    map.setTerrain({ source: 'terrainSource', exaggeration: TERRAIN_EXAGGERATION });
                } catch (error) {
                    setStatus(`Waiting for style load before installing terrain layers: ${getErrorMessage(error)}`, 'warn');
                    return false;
                }

                let hillshadeReady = true;
                if (USE_TRANSPARENT_HILLSHADE_CACHE) {
                    hillshadeReady = safeAddLayer({
                        id: 'terrain-derivative-cache',
                        type: 'hillshade',
                        source: 'terrainSource',
                        layout: { visibility: 'visible' },
                        paint: {
                            'hillshade-method': 'igor',
                            'hillshade-exaggeration': 1.0,
                            'hillshade-illumination-direction': 315,
                            'hillshade-illumination-altitude': 45,
                            'hillshade-shadow-color': 'rgba(0,0,0,0)',
                            'hillshade-highlight-color': 'rgba(255,255,255,0)',
                            'hillshade-accent-color': 'rgba(255,255,255,0)'
                        }
                    });
                } else {
                    window._hillshadePrepareDebug = {
                        layer: 'terrain-owned-derivative-cache',
                        disabled: true,
                        reason: 'terrain prepares visible tile derivatives directly',
                        inputTiles: 0,
                        prepared: 0,
                        skippedClean: 0,
                        skippedNoDem: 0,
                        zooms: {},
                        durationMs: 0,
                        timestamp: performance.now()
                    };
                    window._hillshadeRenderDebug = {
                        layer: 'terrain-owned-derivative-cache',
                        skippedVisibleDraw: true,
                        disabled: true,
                        tileIDs: 0,
                        timestamp: performance.now()
                    };
                }

                const satelliteReady = safeAddLayer({
                    id: 'esri-satellite',
                    type: 'raster',
                    source: 'esriWorldImagery',
                    layout: { visibility: 'none' },
                    paint: {
                        'raster-opacity': 1.0,
                        'raster-fade-duration': 0
                    }
                });

                const shadowReady = safeAddLayer({
                    id: 'shadow-coarse',
                    type: 'shadow',
                    source: 'terrainSource',
                    paint: {
                        'shadow-opacity': 1.0,
                        'shadow-color': '#000000',
                        'shadow-shadow-color': '#000000',
                        'shadow-highlight-color': '#ffffff',
                        'shadow-direction': 315,
                        'shadow-altitude': 45,
                        'shadow-max-distance': 8000,
                        'shadow-penumbra': 1.0
                    }
                });

                const daylightReady = safeAddLayer({
                    id: 'daylight-native',
                    type: 'daylight',
                    source: 'terrainSource',
                    layout: { visibility: 'none' },
                    paint: {
                        'daylight-opacity': 0.78,
                        'daylight-color-ramp': [
                            'interpolate',
                            ['linear'],
                            ['line-progress'],
                            0.0, '#440154',
                            0.15, '#46327e',
                            0.32, '#365c8d',
                            0.50, '#277f8e',
                            0.64, '#2fb47c',
                            0.78, '#b8de29',
                            0.90, '#fdae32',
                            1.0, '#d7191c'
                        ]
                    }
                });

                dom.satelliteToggle.disabled = !satelliteReady;
                dom.coarseToggle.disabled = !shadowReady;
                dom.daylightToggle.disabled = !daylightReady;

                updateSun(true);
                state.layersInstalled = true;
                setStatus('Map loaded. Terrain atlas and shadow passes will populate as DEM tiles arrive.');
                return true;
            }

            function scheduleLayerInstall(delay = 0) {
                if (state.layersInstalled) return;
                window.setTimeout(() => {
                    if (state.layersInstalled) return;
                    const installed = installLayers();
                    if (!installed && state.layerInstallAttempts < 40) {
                        scheduleLayerInstall(250);
                    }
                }, delay);
            }

            function installMap() {
                if (!window.maplibregl?.Map) {
                    setStatus('Custom MapLibre build did not load.', 'error');
                    return;
                }

                state.map = new maplibregl.Map({
                    container: dom.map,
                    center: DEFAULT_CENTER,
                    zoom: DEFAULT_ZOOM,
                    pitch: DEFAULT_PITCH,
                    bearing: DEFAULT_BEARING,
                    style: createStyle()
                });

                window.shadowDebugMap = state.map;

                state.map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

                state.map.once('load', () => scheduleLayerInstall(0));
                state.map.once('style.load', () => scheduleLayerInstall(0));
                scheduleLayerInstall(0);
                scheduleLayerInstall(250);
                state.map.on('movestart', deferCameraShadowRefresh);
                state.map.on('move', deferCameraShadowRefresh);
                state.map.on('moveend', () => {
                    finishCameraShadowRefresh();
                    if (dom.atlasOverlay.style.display === 'block') {
                        updateAtlasDebug();
                    }
                });
                state.map.on('error', event => {
                    const message = getErrorMessage(event);
                    if (/tile|image|fetch|network|request/i.test(message)) {
                        state.tileErrorCount += 1;
                        setStatus(`Tile/source warning (${state.tileErrorCount}): ${message}`, 'warn');
                    } else {
                        setStatus(message, 'error');
                    }
                });
                state.map.on('webglcontextlost', () => setStatus('WebGL context lost.', 'error'));
                state.map.on('webglcontextrestored', () => {
                    setStatus('WebGL context restored. Rebuilding shadow layers...');
                    state.map.once('idle', updateSun);
                });
            }

            function installLongTaskObserver() {
                if (state.longTaskObserverInstalled) return;
                if (!('PerformanceObserver' in window)) return;
                const supported = PerformanceObserver.supportedEntryTypes || [];
                if (!supported.includes('longtask')) return;

                try {
                    const observer = new PerformanceObserver(list => {
                        if (!state.tileDebugEnabled) return;
                        for (const entry of list.getEntries()) {
                            state.longTasks.push({
                                startTime: entry.startTime,
                                duration: entry.duration,
                                name: entry.name || 'longtask'
                            });
                        }
                        if (state.longTasks.length > 24) {
                            state.longTasks.splice(0, state.longTasks.length - 24);
                        }
                    });
                    observer.observe({ entryTypes: ['longtask'] });
                    state.longTaskObserver = observer;
                    state.longTaskObserverInstalled = true;
                } catch (error) {
                    console.warn('[shadow-poc perf] Long task observer unavailable:', getErrorMessage(error));
                }
            }

            function updateFpsCounter() {
                const samples = [];
                let last = performance.now();

                function tick() {
                    const now = performance.now();
                    const frameMs = now - last;
                    if (frameMs > 1000) {
                        state.lastFrameGapMs = frameMs;
                        samples.length = 0;
                        last = now;
                        requestAnimationFrame(tick);
                        return;
                    }

                    samples.push(frameMs);
                    last = now;
                    if (samples.length > 120) samples.shift();

                    const average = samples.reduce((sum, value) => sum + value, 0) / samples.length;
                    const sorted = samples.slice().sort((a, b) => a - b);
                    const p95 = sorted[Math.max(0, Math.floor(sorted.length * 0.95) - 1)] || average;
                    const worst = sorted[sorted.length - 1] || average;
                    const longFrames = samples.filter(value => value > 50).length;
                    const fps = Math.max(0, Math.round(1000 / average));
                    const fpsStats = {
                        fps,
                        averageMs: average,
                        p95Ms: p95,
                        worstMs: worst,
                        longFrames,
                        frameMs,
                        droppedGapMs: state.lastFrameGapMs,
                        timestamp: now
                    };
                    state.lastFpsStats = fpsStats;
                    dom.fps.textContent = `${fps} FPS\navg ${average.toFixed(1)}ms p95 ${p95.toFixed(1)}ms`;
                    dom.fps.style.color = fps > 40 ? '#2ecc71' : fps > 20 ? '#f1c40f' : '#e74c3c';
                    if (state.tileDebugEnabled && now - state.lastTilePanelUpdateAt > TILE_DEBUG_PANEL_REFRESH_MS) {
                        state.lastTilePanelUpdateAt = now;
                        updateTileDebugPanel(fpsStats);
                    }
                    requestAnimationFrame(tick);
                }

                requestAnimationFrame(tick);
            }

            function formatCounts(counts) {
                if (!counts || typeof counts !== 'object') return '-';
                return Object.entries(counts)
                    .sort(([a], [b]) => Number(a) - Number(b))
                    .map(([key, value]) => `z${key}:${value}`)
                    .join(' ');
            }

            function fmtMs(value) {
                return Number.isFinite(value) ? `${value.toFixed(1)}ms` : '-';
            }

            function sanitizeDebugValue(value, depth = 0) {
                if (value === null || typeof value !== 'object') return value;
                if (depth > 5) return '[depth-limit]';
                if (Array.isArray(value)) {
                    const items = value.slice(0, 200).map(item => sanitizeDebugValue(item, depth + 1));
                    if (value.length > items.length) items.push(`[${value.length - items.length} more items]`);
                    return items;
                }

                const cleaned = {};
                Object.entries(value).forEach(([key, entry]) => {
                    if (typeof entry === 'function') return;
                    if (/canvas|context|texture|gl|pixels|imageData/i.test(key)) {
                        cleaned[key] = '[omitted]';
                        return;
                    }
                    cleaned[key] = sanitizeDebugValue(entry, depth + 1);
                });
                return cleaned;
            }

            function stringifyDebugSnapshot(snapshot) {
                try {
                    return JSON.stringify(sanitizeDebugValue(snapshot), null, 2);
                } catch (error) {
                    return `Could not stringify raw debug snapshot: ${getErrorMessage(error)}`;
                }
            }

            async function copyTileDebugText() {
                const summary = state.lastTileDebugText || dom.tileLog.textContent || '';
                const raw = state.lastTileDebugSnapshot
                    ? stringifyDebugSnapshot(state.lastTileDebugSnapshot)
                    : '{}';
                const text = [
                    summary.replace(/\n\nraw snapshot available from Copy Debug Text\.$/, ''),
                    '',
                    'raw snapshot',
                    raw
                ].join('\n');
                if (!text) return;

                try {
                    if (navigator.clipboard?.writeText) {
                        await navigator.clipboard.writeText(text);
                    } else {
                        const textArea = document.createElement('textarea');
                        textArea.value = text;
                        textArea.setAttribute('readonly', '');
                        textArea.style.position = 'fixed';
                        textArea.style.left = '-9999px';
                        document.body.appendChild(textArea);
                        textArea.select();
                        const copied = document.execCommand('copy');
                        document.body.removeChild(textArea);
                        if (!copied) throw new Error('document.execCommand("copy") returned false');
                    }

                    dom.copyTileLog.textContent = 'Copied';
                    window.setTimeout(() => {
                        dom.copyTileLog.textContent = 'Copy Debug Text';
                    }, 900);
                } catch (error) {
                    setStatus(`Could not copy debug text: ${getErrorMessage(error)}`, 'warn');
                }
            }

            function updateTileDebugPanel(fpsStats = state.lastFpsStats) {
                if (!state.tileDebugEnabled) return;
                const updateStart = performance.now();
                const terrain = window._terrainTileDebug || {};
                const atlas = window._elevationAtlasDebug || {};
                const atlasReuse = window._shadowAtlasReuseDebug || {};
                const shadow = window._shadowPassDebug || {};
                const shadowOffscreen = window._shadowOffscreenDebug || {};
                const horizonPrepare = window._horizonPrepareDebug || {};
                const hillshade = window._hillshadePrepareDebug || {};
                const hillshadeRender = window._hillshadeRenderDebug || {};
                const daylightPrepare = window._daylightPrepareDebug || {};
                const daylight = window._daylightDebug || {};
                const progressivePhase = window._shadowProgressivePhase || window._shadowProgressiveLastPhase || 'stable';
                const moving = state.map && typeof state.map.isMoving === 'function' ? state.map.isMoving() : false;
                const center = state.map ? state.map.getCenter() : null;
                const mapState = state.map ? {
                    moving,
                    cameraShadowDeferred: state.cameraShadowDeferred,
                    cameraShadowRefreshHold: state.cameraShadowRefreshHold,
                    cameraShadowPreviewActive: state.cameraShadowPreviewActive,
                    progressivePhase,
                    zoom: state.map.getZoom(),
                    bearing: state.map.getBearing(),
                    pitch: state.map.getPitch(),
                    center: center ? { lng: center.lng, lat: center.lat } : null
                } : { moving: false };
                const lastLongTask = state.longTasks[state.longTasks.length - 1];

                const lines = [
                    `fps ${fpsStats?.fps ?? '--'} avg ${fmtMs(fpsStats?.averageMs)} p95 ${fmtMs(fpsStats?.p95Ms)} worst ${fmtMs(fpsStats?.worstMs)} last ${fmtMs(fpsStats?.frameMs)} gap ${fmtMs(fpsStats?.droppedGapMs)} long>${fpsStats?.longFrames ?? 0}`,
                    `map moving=${moving} shadowDeferred=${state.cameraShadowDeferred} refreshHold=${state.cameraShadowRefreshHold} preview=${state.cameraShadowPreviewActive} phase=${progressivePhase} zoom=${state.map ? state.map.getZoom().toFixed(2) : '-'}`,
                    `debug ui=${fmtMs(state.lastTileDebugUiMs)} panelRate=${TILE_DEBUG_PANEL_REFRESH_MS}ms longTask=${lastLongTask ? fmtMs(lastLongTask.duration) : '-'}`,
                    '',
                    `terrain draw ${fmtMs(terrain.durationMs)} tiles=${terrain.renderTiles ?? '-'} moving=${terrain.moving ?? '-'} horizon=${terrain.horizonReady === true}`,
                    `terrain z ${formatCounts(terrain.terrainZooms)}`,
                    `source z  ${formatCounts(terrain.sourceZooms)} missingDEM=${terrain.missingDem ?? '-'}`,
                    `deriv ready=${terrain.derivativeReady ?? '-'} missing=${terrain.derivativeMissing ?? '-'} manualPrepare=${terrain.derivativeManualPrepare ?? '-'} skippedMoving=${terrain.derivativeSkippedMoving ?? '-'} prep=${fmtMs(terrain.derivativePrepareMs)}`,
                    terrain.missingDerivativeTiles?.length ? `missing ${terrain.missingDerivativeTiles.join(' ')}` : 'missing -',
                    '',
                    hillshade.disabled
                        ? `hillshade cache ${hillshade.layer || 'disabled'} offscreenLayer=false`
                        : `hillshade prep ${fmtMs(hillshade.durationMs)} in=${hillshade.inputTiles ?? '-'} prepared=${hillshade.prepared ?? '-'} clean=${hillshade.skippedClean ?? '-'} noDEM=${hillshade.skippedNoDem ?? '-'} skippedMoving=${hillshade.skippedWhileMoving ?? '-'}`,
                    `hillshade z ${formatCounts(hillshade.zooms)} visibleSkipped=${hillshadeRender.skippedVisibleDraw === true}`,
                    '',
                    `atlas ${fmtMs(atlas.durationMs)} visible=${atlas.visibleTiles ?? '-'} cells=${atlas.tiles?.length ?? '-'} lod=${atlas.lodZooms?.join('/') ?? '-'} phase=${atlas.progressivePhase ?? '-'}`,
                    `atlas reuse covered=${atlasReuse.reusedCoveredAtlas === true} cachedPhase=${atlasReuse.cachedAtlasPhase ?? '-'}`,
                    `atlas visible z ${formatCounts(atlas.visibleZooms)}`,
                    `atlas capture z ${formatCounts(atlas.captureZooms)}`,
                    `atlas source z ${formatCounts(atlas.sourceZooms)}`,
                    '',
                    `shadow ${shadow.skipped ? `skipped ${shadow.reason}` : fmtMs(shadow.durationMs)} size=${shadow.atlasPixelSize ?? '-'} blur=${fmtMs(shadow.blurMs)} steps=${shadow.maxSteps ?? '-'} step=${shadow.stepMeters ?? '-'} offscreenSkip=${shadowOffscreen.skippedCachedWhileMoving === true || shadowOffscreen.skippedHorizonCurrentShadow === true}`,
                    `horizon atlas ${horizonPrepare.skipped ? `skipped ${horizonPrepare.reason}` : fmtMs(horizonPrepare.durationMs)} preset=${horizonPrepare.preset ?? window._horizonQualityPreset ?? '-'} prepared=${horizonPrepare.prepared ?? '-'} clean=${horizonPrepare.clean ?? '-'} size=${horizonPrepare.size ?? '-'} bins=${horizonPrepare.bins ?? '-'} steps=${horizonPrepare.maxSteps ?? '-'} step=${horizonPrepare.stepMeters ? horizonPrepare.stepMeters.toFixed(1) : '-'}`,
                    `daylight atlas ${daylightPrepare.skipped ? `skipped ${daylightPrepare.reason}` : fmtMs(daylightPrepare.durationMs)} prepared=${daylightPrepare.prepared ?? '-'} clean=${daylightPrepare.clean ?? '-'} size=${daylightPrepare.daylightAtlasSize ?? daylight.daylightAtlasSize ?? '-'}/${daylightPrepare.horizonAtlasSize ?? daylight.horizonAtlasSize ?? '-'}`,
                    `daylight draw tiles=${daylight.inputTiles ?? '-'} drawn=${daylight.drawnTiles ?? '-'} skipped=${daylight.skippedTiles ?? '-'} atlasReady=${daylight.atlasReady === true} samples=${daylightPrepare.samples ?? daylight.samples ?? '-'} stepMin=${daylightPrepare.timeWeightMins ? daylightPrepare.timeWeightMins.toFixed(1) : '-'} date=${daylight.date ? daylight.date.slice(0, 10) : '-'}`
                ];

                state.lastTileDebugSnapshot = {
                    fps: fpsStats,
                    map: mapState,
                    debugUi: {
                        panelRefreshMs: TILE_DEBUG_PANEL_REFRESH_MS,
                        lastPanelUpdateMs: state.lastTileDebugUiMs,
                        cameraSettleMs: CAMERA_SHADOW_SETTLE_MS,
                        cameraFineDelayMs: CAMERA_SHADOW_FINE_DELAY_MS,
                        cameraIdleTimeoutMs: CAMERA_SHADOW_IDLE_TIMEOUT_MS,
                        progressivePhase,
                        longTasks: state.longTasks.slice(-8)
                    },
                    terrain,
                    hillshade,
                    hillshadeRender,
                    atlas,
                    atlasReuse,
                    shadow,
                    shadowOffscreen,
                    horizonPrepare,
                    daylightPrepare,
                    daylight
                };
                state.lastTileDebugText = `${lines.join('\n')}\n\nraw snapshot available from Copy Debug Text.`;
                dom.tileLog.textContent = state.lastTileDebugText;
                state.lastTileDebugUiMs = performance.now() - updateStart;

                const now = performance.now();
                if (now - state.lastTileConsoleLogAt > 2000) {
                    state.lastTileConsoleLogAt = now;
                    console.log('[shadow-poc perf]', {
                        fps: fpsStats,
                        debugUi: state.lastTileDebugSnapshot?.debugUi,
                        terrain,
                        hillshade,
                        hillshadeRender,
                        atlas,
                        atlasReuse,
                        shadow,
                        shadowOffscreen,
                        horizonPrepare,
                        daylightPrepare,
                        daylight
                    });
                }
            }

            function openAtlasDebug() {
                if (!state.map || typeof state.map.readElevationAtlasPixels !== 'function') {
                    setStatus('Elevation atlas readback API is not available in this MapLibre build.', 'warn');
                    return;
                }

                dom.atlasOverlay.style.display = 'block';
                state.map.triggerRepaint();
                updateAtlasDebug();

                clearInterval(state.atlasTimer);
                state.atlasTimer = window.setInterval(updateAtlasDebug, ATLAS_REFRESH_MS);
            }

            function closeAtlasDebug() {
                dom.atlasOverlay.style.display = 'none';
                clearInterval(state.atlasTimer);
                state.atlasTimer = null;
            }

            function drawAtlasMessage(message) {
                const overlayCtx = dom.atlasOverlayCanvas.getContext('2d');
                overlayCtx.clearRect(0, 0, dom.atlasOverlayCanvas.width, dom.atlasOverlayCanvas.height);
                overlayCtx.fillStyle = 'rgba(0,0,0,0.62)';
                overlayCtx.fillRect(0, 0, dom.atlasOverlayCanvas.width, dom.atlasOverlayCanvas.height);
                overlayCtx.fillStyle = '#fff';
                overlayCtx.font = '13px ui-monospace, Menlo, Consolas, monospace';
                overlayCtx.fillText(message, 14, 28);
                dom.atlasStatus.textContent = message;
            }

            function updateAtlasDebug() {
                const meta = window._elevationAtlasDebug;
                if (!meta || !Array.isArray(meta.bounds)) {
                    drawAtlasMessage('Waiting for elevation atlas metadata.');
                    return;
                }

                const isMoving = typeof state.map.isMoving === 'function' && state.map.isMoving();
                if (isMoving && state.lastAtlasPixelsTimestamp) {
                    drawAtlasOverlay(meta);
                    updateAtlasStatus(meta, 'readback paused while moving');
                    return;
                }

                if (meta.timestamp === state.lastAtlasPixelsTimestamp) {
                    drawAtlasOverlay(meta);
                    updateAtlasStatus(meta);
                    return;
                }

                let pixels;
                try {
                    pixels = state.map.readElevationAtlasPixels();
                } catch (error) {
                    drawAtlasMessage(`Atlas readback failed: ${getErrorMessage(error)}`);
                    return;
                }

                if (!pixels || !pixels.length) {
                    drawAtlasMessage('Elevation atlas FBO is not ready yet.');
                    return;
                }

                const atlasSize = meta.size || Math.sqrt(pixels.length / 4);
                if (!Number.isFinite(atlasSize) || atlasSize <= 0) {
                    drawAtlasMessage('Elevation atlas size is invalid.');
                    return;
                }
                state.lastAtlasPixelsTimestamp = meta.timestamp;

                if (dom.atlasCanvas.width !== atlasSize) {
                    dom.atlasCanvas.width = atlasSize;
                    dom.atlasCanvas.height = atlasSize;
                    state.offscreenAtlasCanvas.width = atlasSize;
                    state.offscreenAtlasCanvas.height = atlasSize;
                } else if (state.offscreenAtlasCanvas.width !== atlasSize) {
                    state.offscreenAtlasCanvas.width = atlasSize;
                    state.offscreenAtlasCanvas.height = atlasSize;
                }

                const displayPixels = new Uint8ClampedArray(pixels);
                for (let i = 0; i < displayPixels.length; i += 4) {
                    if (displayPixels[i + 3] === 0) {
                        displayPixels[i] = 30;
                        displayPixels[i + 1] = 30;
                        displayPixels[i + 2] = 30;
                        displayPixels[i + 3] = 255;
                        continue;
                    }

                    const r = displayPixels[i] / 255;
                    const g = displayPixels[i + 1] / 255;
                    const b = displayPixels[i + 2] / 255;
                    const a = displayPixels[i + 3] / 255;
                    const packed = r / 16777216 + g / 65536 + b / 256 + a;
                    const elevation = packed * 20000 - 10000;
                    const normalized = clamp(elevation / 4800, 0, 1);
                    const color = elevationToDebugColor(normalized);

                    displayPixels[i] = color[0];
                    displayPixels[i + 1] = color[1];
                    displayPixels[i + 2] = color[2];
                    displayPixels[i + 3] = 255;
                }

                const atlasCtx = dom.atlasCanvas.getContext('2d');
                const offscreenCtx = state.offscreenAtlasCanvas.getContext('2d');
                offscreenCtx.putImageData(new ImageData(displayPixels, atlasSize, atlasSize), 0, 0);

                atlasCtx.save();
                atlasCtx.clearRect(0, 0, atlasSize, atlasSize);
                atlasCtx.scale(1, -1);
                atlasCtx.translate(0, -atlasSize);
                atlasCtx.drawImage(state.offscreenAtlasCanvas, 0, 0);
                atlasCtx.restore();

                drawAtlasOverlay(meta);
                updateAtlasStatus(meta);
            }

            function updateAtlasStatus(meta, suffix = '') {
                if (meta.timestamp === state.lastAtlasTimestamp && !suffix) return;
                state.lastAtlasTimestamp = meta.timestamp;
                const fallbackText = Number.isFinite(meta.parentFallbackCount)
                    ? `, ${meta.parentFallbackCount} parent fallbacks, ${meta.flatFallbackCount || 0} flat`
                    : '';
                const lodText = Array.isArray(meta.lodZooms) && meta.lodZooms.length
                    ? `lod z${meta.lodZooms.join('/z')}, `
                    : Number.isFinite(meta.targetZoom) ? `z${meta.targetZoom}, ` : '';
                const suffixText = suffix ? `, ${suffix}` : '';
                dom.atlasStatus.textContent = `${lodText}${meta.tiles?.length || 0} cells${fallbackText}, bounds ${meta.bounds.map(v => v.toFixed(5)).join(', ')}${suffixText}`;
            }

            function elevationToDebugColor(normalized) {
                if (normalized < 0.25) {
                    const t = normalized / 0.25;
                    return [0, Math.floor(t * 255), 255];
                }
                if (normalized < 0.5) {
                    const t = (normalized - 0.25) / 0.25;
                    return [0, 255, Math.floor((1 - t) * 255)];
                }
                if (normalized < 0.75) {
                    const t = (normalized - 0.5) / 0.25;
                    return [Math.floor(t * 255), 255, 0];
                }
                if (normalized < 0.95) {
                    const t = (normalized - 0.75) / 0.20;
                    return [255, Math.floor((1 - t) * 255), 0];
                }
                const t = (normalized - 0.95) / 0.05;
                return [255, Math.floor(t * 255), Math.floor(t * 255)];
            }

            function drawAtlasOverlay(meta) {
                const ctx = dom.atlasOverlayCanvas.getContext('2d');
                const width = dom.atlasOverlayCanvas.width;
                const height = dom.atlasOverlayCanvas.height;
                ctx.clearRect(0, 0, width, height);

                const [minX, minY, maxX, maxY] = meta.bounds;
                const spanX = maxX - minX;
                const spanY = maxY - minY;
                if (spanX <= 0 || spanY <= 0) {
                    drawAtlasMessage('Atlas bounds have zero area.');
                    return;
                }

                const zColors = {
                    10: '#3498db',
                    11: '#2ecc71',
                    12: '#f1c40f',
                    13: '#e67e22',
                    14: '#e74c3c',
                    15: '#9b59b6',
                    16: '#ecf0f1'
                };

                (meta.tiles || []).forEach(tile => {
                    const scale = 1 << tile.z;
                    const tx = tile.x / scale;
                    const ty = tile.y / scale;
                    const tw = 1 / scale;
                    const th = 1 / scale;
                    const px = ((tx - minX) / spanX) * width;
                    const py = ((ty - minY) / spanY) * height;
                    const pw = (tw / spanX) * width;
                    const ph = (th / spanY) * height;
                    const color = zColors[tile.z] || '#ffffff';

                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(px, py, pw, ph);
                    ctx.fillStyle = color;
                    ctx.font = 'bold 10px ui-monospace, Menlo, Consolas, monospace';
                    ctx.fillText(`Z${tile.z}`, px + 4, py + 12);
                });

                const center = state.map.getCenter();
                const mercator = lngLatToMercator01(center.lng, center.lat);
                const cX = ((mercator.x - minX) / spanX) * width;
                const cY = ((mercator.y - minY) / spanY) * height;

                drawVector(ctx, cX, cY, mapBearingVector(), 30, '#ff00ff', 4);

                const date = getSelectedDateTime();
                if (date) {
                    const sun = computeSun(date, center);
                    const radians = sun.azimuth * Math.PI / 180;
                    drawVector(ctx, cX, cY, {
                        x: Math.sin(radians),
                        y: -Math.cos(radians)
                    }, 50, '#f1c40f', 4);
                }
            }

            function lngLatToMercator01(lng, lat) {
                const sin = Math.sin(lat * Math.PI / 180);
                return {
                    x: ((lng + 180) / 360) % 1,
                    y: 0.5 - 0.25 * Math.log((1 + sin) / (1 - sin)) / Math.PI
                };
            }

            function mapBearingVector() {
                const bearing = state.map.getBearing() * Math.PI / 180;
                return {
                    x: Math.sin(bearing),
                    y: -Math.cos(bearing)
                };
            }

            function drawVector(ctx, x, y, dir, length, color, dotRadius) {
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + dir.x * length, y + dir.y * length);
                ctx.stroke();
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + dir.x * length, y + dir.y * length, dotRadius, 0, Math.PI * 2);
                ctx.fill();
            }

            window._shadowDebugMode = 0;
            window._isInteractingWithTime = false;
            window._shadowCameraMoving = false;
            window._shadowCameraRefreshHold = false;
            window._shadowProgressivePhase = 'stable';

            installControls();
            installMap();
            updateFpsCounter();
        })();
    </script>
</body>

</html>
