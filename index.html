<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <title>XploreMap v4.19</title>
  <link rel="icon" type="image/png" href="./data/logos/Xplore.png" />
  <link rel="apple-touch-icon" href="./data/logos/Xplore.png" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />

  <!-- MapLibre GL JS - Local fork (terrain analysis support) -->
  <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="./scripts/map/maplibre-gl-dev.js?v=20260430-sun-window-layer-1"></script>

  <!-- PMTiles v4 -->
  <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>

  <!-- Turf.js for route distance calculations -->
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <!-- MapLibre GL Geocoder for address search -->
  <script src="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.css" />

  <!-- FPS Counter -->
  <script src="https://unpkg.com/mapbox-gl-fps@1.0.1/lib/MapboxFPS.min.js"></script>

  <!-- Google Fonts: Inter (UI) + JetBrains Mono (monospace numbers) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">


  <link rel="stylesheet" href="./styles/main.css" />
  <script src="./maplibre-preload.js"></script>

  <!-- SunCalc library for accurate sun position -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.8.0/suncalc.min.js"></script>

  <!-- Stars Layer for Globe Mode -->
  <script src="./scripts/map/stars-layer.js"></script>

  <style>
    .fps-control {
      color: #fff !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 16px !important;
      font-weight: 600 !important;
      padding: 4px 8px !important;
      background: rgba(0, 0, 0, 0.4) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      border-radius: 4px !important;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <!-- 2D / 3D toggle — repositioned below compass by JS -->
  <button id="toggle3D" class="btn btn--icon-only map-action-btn toggle-3d" type="button" aria-pressed="true"
    aria-label="Switch to 2D" title="Switch to 2D">
    <span class="toggle-3d__label">3D</span>
    <span class="sr-only">Toggle 2D/3D view</span>
  </button>
  <header class="app-header">
    <div class="app-header__left">
      <div class="app-header__logo">
        <img src="./data/logos/Xplore.png" alt="Xplore logo" class="app-header__logo-img" />
        <span class="app-header__logo-text">Xplore</span>
      </div>
    </div>
    <div class="app-header__center">
      <div id="headerGeocoder" class="header-geocoder"></div>
    </div>
    <div class="app-header__right">
      <!-- Routing settings moved to sidebar -->
    </div>
  </header>
  <div class="vignette" aria-hidden="true"></div>
  <!-- DISABLED: CSS Fog overlay - not working well -->
  <!-- <div id="fogOverlay" class="fog-overlay" aria-hidden="true"></div> -->

  <!-- UI: View mode sidebar -->
  <div class="ui">
    <div class="ui__row ui__row--directions">
      <button id="directionsToggle" class="btn btn--icon map-action-btn directions-toggle"
        aria-label="Toggle functionality panel" aria-expanded="false" title="Directions & Analysis">
        <img class="directions-toggle__icon" src="./data/edit.png" alt="" aria-hidden="true" />
      </button>
      <button id="libraryToggle" class="btn btn--icon map-action-btn library-toggle" aria-label="Toggle Route Library"
        aria-expanded="false" title="Route Library">
        <img class="library-toggle__icon" src="./data/folder.png" alt="" aria-hidden="true" />
      </button>

      <!-- Consolidated Actions Bar -->
      <div id="directionsActionsBar" class="directions-actions-bar" aria-hidden="true">
        <!-- Routing modes -->
        <button id="routeModeSnap" class="btn btn--icon btn--icon-only route-mode-btn" type="button"
          data-mode="foot-hiking" aria-pressed="true" aria-label="Snap to trails" title="Snap to trails">
          <img src="./data/aimant.png" alt="" aria-hidden="true" loading="lazy" decoding="async" />
        </button>
        <button id="routeModeManual" class="btn btn--icon btn--icon-only route-mode-btn" type="button"
          data-mode="manual" aria-pressed="false" aria-label="Manual line" title="Manual line">
          <img src="./data/line.png" alt="" aria-hidden="true" loading="lazy" decoding="async" />
        </button>
        <button id="routingModeToggle" class="btn btn--icon btn--icon-only routing-mode-toggle" type="button"
          data-routing-mode="offline" aria-pressed="true" title="Switch to online routing">
          <img class="routing-mode-toggle__icon" data-icon-id="routing-offline" alt="" aria-hidden="true" loading="lazy"
            decoding="async" />
          <span class="routing-mode-toggle__spinner" aria-hidden="true"></span>
        </button>

        <div class="directions-actions-bar__separator"></div>

        <!-- Actions -->
        <button id="swapDirectionsButton" class="btn btn--icon btn--icon-only" type="button" aria-label="Swap A and B"
          title="Swap A and B">
          <img src="./data/swap.png" alt="" aria-hidden="true" loading="lazy" decoding="async" />
        </button>
        <button id="undoDirectionsButton" class="btn btn--icon btn--icon-only" type="button" aria-label="Undo"
          title="Undo" disabled>
          <img src="./data/undo.png" alt="" aria-hidden="true" loading="lazy" decoding="async" />
        </button>
        <button id="redoDirectionsButton" class="btn btn--icon btn--icon-only" type="button" aria-label="Redo"
          title="Redo" disabled>
          <img src="./data/redo.png" alt="" aria-hidden="true" loading="lazy" decoding="async" />
        </button>
        <button id="clearDirectionsButton" class="btn btn--icon btn--icon-only" type="button" aria-label="Clear"
          title="Clear">
          <img src="./data/clear.png" alt="" aria-hidden="true" loading="lazy" decoding="async" />
        </button>
        <button id="saveRouteButton" class="btn btn--icon btn--icon-only" type="button" aria-label="Save Route"
          title="Save Route">
          <img src="./data/diskette.png" alt="" aria-hidden="true" loading="lazy" decoding="async" />
        </button>

        <div class="directions-actions-bar__separator"></div>

        <!-- GPX and Elevation -->
        <button id="gpxImportButton" class="btn btn--icon btn--icon-only" type="button" title="Import GPX">
          <img data-icon-id="gpx-import" alt="" aria-hidden="true" loading="lazy" decoding="async" />
          <span class="sr-only">Import GPX</span>
        </button>
        <input id="gpxFileInput" class="sr-only" type="file" accept=".gpx,application/gpx+xml">
        <button id="gpxExportButton" class="btn btn--icon btn--icon-only" type="button" title="Export GPX">
          <img data-icon-id="gpx-export" alt="" aria-hidden="true" loading="lazy" decoding="async" />
          <span class="sr-only">Export GPX</span>
        </button>

        <!-- Debug -->
        <div id="debugNetworkControlWrapper" style="display: none;">
          <label id="debugNetworkControl" class="debug-network-control" role="button" aria-pressed="false">
            <input id="debugNetworkCheckbox" class="sr-only" type="checkbox"
              aria-label="Toggle offline routing network debug" />
            <img data-icon-id="debug-network" alt="" aria-hidden="true" loading="lazy" decoding="async" />
          </label>
        </div>
      </div>
    </div>
  </div>



  </div>




  <div id="directionsDock" class="directions-dock" aria-label="Directions Panel">
    <!-- Route Library Dock -->
    <div id="routeLibraryDock" class="route-library-dock" aria-label="Route Library Panel" aria-hidden="true">
      <div class="library-header">
        <h2 class="library-title">Saved Routes</h2>
        <div class="search-container">
          <input type="text" id="librarySearchInput" placeholder="Search routes..." aria-label="Search routes">
        </div>
        <div class="library-actions">
          <button id="libraryImportBtn" class="btn btn--sm" title="Import GPX">
            <img src="./data/upload.png" alt="Import" width="16" height="16">
          </button>
          <input type="file" id="libraryGpxInput" accept=".gpx,application/gpx+xml" multiple class="hidden-file-input"
            aria-hidden="true">
        </div>
      </div>
      <div class="library-content">
        <div id="routeList" class="route-list">
          <!-- Route cards will be injected here -->
          <div class="empty-state">No saved routes yet.</div>
        </div>
      </div>
    </div>

    <div id="directionsControl" class="directions-control" aria-live="polite" aria-hidden="true">
      <!-- Elevation chart (top - expandable) -->
      <div id="elevationCard" class="elevation-section elevation-section--collapsed chart-card--collapsed" role="group"
        aria-label="Route elevation overview">
        <div id="elevationChartBody" class="elevation-section__body" hidden aria-hidden="true">
          <div class="elevation-section__chart-wrapper">
            <div class="elevation-section__y-axis" id="elevationYAxisLabels">
              <span class="chart-card__y-max"></span>
              <span class="chart-card__y-min"></span>
            </div>
            <div id="elevationChart" class="elevation-chart" aria-hidden="true"></div>
            <!-- Profile mode controls - positioned on the right side of the chart -->
            <div class="profile-mode-sidebar" role="radiogroup" aria-label="Profile display mode">
              <!-- Legend popup (appears on hover when hovering over a mode icon) -->
              <div id="profileLegend" class="profile-legend" role="group" aria-label="Route overlay legend"
                aria-hidden="true" data-ready="false"></div>
              <button type="button" class="profile-mode-sidebar__item" data-profile-mode="slope" role="radio"
                aria-checked="false" title="Pente">
                <img src="./data/icons_Xmap/pente.png" alt="" aria-hidden="true" />
                <span class="sr-only">Pente</span>
              </button>
              <button type="button" class="profile-mode-sidebar__item" data-profile-mode="surface" role="radio"
                aria-checked="false" title="Surface">
                <img src="./data/icons_Xmap/surface.png" alt="" aria-hidden="true" />
                <span class="sr-only">Surface</span>
              </button>
              <button type="button" class="profile-mode-sidebar__item" data-profile-mode="category" role="radio"
                aria-checked="false" title="Difficulté">
                <img src="./data/icons_Xmap/difficulty.png" alt="" aria-hidden="true" />
                <span class="sr-only">Difficulté</span>
              </button>
              <button type="button" class="profile-mode-sidebar__item" data-profile-mode="poi" role="radio"
                aria-checked="false" title="POI">
                <img src="./data/icons_Xmap/POI.png" alt="" aria-hidden="true" />
                <span class="sr-only">POI</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <!-- Route stats area -->
      <div id="routeTimeline" class="route-timeline"></div>
      <div id="routeStats" class="route-stats" aria-live="polite"></div>
      <!-- Actions moved to sidebar bar -->
    </div>
  </div>

  <!-- Routing start tooltip - shown when dock opens with no waypoints -->
  <div id="routingStartTooltip" class="routing-start-tooltip" aria-hidden="true">
    <span class="routing-start-tooltip__text">Click on the map to begin routing</span>
  </div>
  </div>

  <!-- Layer & Map Controls -->
  <div class="imagery-panel" id="imageryPanel">
    <div class="imagery-panel__buttons">
      <!-- Photos toggle -->
      <div class="imagery-panel__control-group">
        <button id="photosToolboxToggle" class="btn map-action-btn photos-toolbox-toggle" type="button" title="Photos">
          <img src="./data/icons_Xmap/camera.png" alt="" loading="lazy" decoding="async" />
          <span class="sr-only">Photos</span>
        </button>
      </div>

      <!-- Shadow toolbox -->
      <div class="imagery-panel__control-group">
        <button id="shadowToolboxToggle" class="btn map-action-btn shadow-toolbox-toggle" type="button"
          aria-expanded="false" aria-controls="shadowToolbox" title="Sun Analysis">
          <img src="./data/sun.png" alt="" loading="lazy" decoding="async" />
          <span class="sr-only">Sun Analysis</span>
        </button>
        <div id="shadowToolbox" class="shadow-toolbox" aria-hidden="true">
          <!-- Content populated by JS -->
        </div>
      </div>

      <!-- Snow toolbox -->
      <div class="imagery-panel__control-group">
        <button id="snowToolboxToggle" class="btn map-action-btn snow-toolbox-toggle" type="button"
          aria-expanded="false" aria-controls="snowToolbox" title="Snow Analysis">
          <img src="./data/snowflake.png" alt="" loading="lazy" decoding="async" />
          <span class="sr-only">Snow Analysis</span>
        </button>
        <div id="snowToolbox" class="snow-toolbox" aria-hidden="true">
          <!-- Content populated by JS -->
        </div>
      </div>

      <!-- Terrain toolbox -->
      <div class="imagery-panel__control-group">
        <button id="terrainToolboxToggle" class="btn map-action-btn terrain-toolbox-toggle" type="button"
          aria-expanded="false" aria-controls="terrainToolbox" title="Terrain Analysis">
          <img src="./data/terrain.png" alt="" loading="lazy" decoding="async" />
          <span class="sr-only">Terrain Analysis</span>
        </button>
        <div id="terrainToolbox" class="terrain-toolbox" aria-hidden="true">
          <!-- Content populated by JS -->
        </div>
      </div>

      <!-- Pathway toolbox -->
      <div class="imagery-panel__control-group">
        <button id="pathwayToolboxToggle" class="btn map-action-btn pathway-toolbox-toggle" type="button"
          aria-expanded="false" aria-controls="pathwayToolbox" title="Pathway Overlays">
          <img src="./data/footsteps.png" alt="" loading="lazy" decoding="async" />
          <span class="sr-only">Pathway Overlays</span>
        </button>
        <div id="pathwayToolbox" class="pathway-toolbox" aria-hidden="true">
          <!-- Content populated by JS -->
        </div>
      </div>

      <!-- Basemap toolbox -->
      <div class="imagery-panel__control-group">
        <button id="basemapToolboxToggle" class="btn map-action-btn basemap-toolbox-toggle" type="button"
          aria-expanded="false" aria-controls="basemapToolbox" title="Basemap">
          <img src="./data/layers.png" alt="" loading="lazy" decoding="async" />
          <span class="sr-only">Basemap</span>
        </button>
        <div id="basemapToolbox" class="basemap-toolbox" aria-hidden="true">
          <!-- Content populated by JS -->
        </div>
      </div>

      <!-- Settings toggle + panel -->
      <button id="settingsToggle" class="btn btn--icon-only map-action-btn settings-toggle" type="button"
        aria-expanded="false" aria-controls="settingsPanel" title="Settings">
        <svg class="settings-toggle__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        <span class="sr-only">Settings</span>
      </button>


      <!-- Settings Panel (dropdown from cog) -->
      <div id="settingsPanel" class="settings-panel" aria-hidden="true">
        <div class="settings-panel__header">
          <span class="settings-panel__title">⚙️ Settings</span>
          <button id="settingsPanelClose" class="settings-panel__close" type="button">&times;</button>
        </div>
        <div class="settings-panel__body">
          <div class="settings-panel__section">
            <div class="settings-panel__section-title">Performance</div>
            <div class="settings-panel__row">
              <label for="dprToggle">Retina Resolution (HD)</label>
              <input type="checkbox" id="dprToggle" checked class="settings-panel__checkbox" />
            </div>
            <div class="settings-panel__row">
              <label for="fovSlider">Vertical FOV</label>
              <div class="settings-panel__slider-group">
                <input type="range" id="fovSlider" class="settings-panel__slider" min="5" max="90" step="1"
                  value="45" />
                <span id="fovLabel" class="settings-panel__value">45°</span>
              </div>
            </div>
            <div class="settings-panel__row">
              <label for="lodMaxZoomSlider">Max Zoom Levels</label>
              <div class="settings-panel__slider-group">
                <input type="range" id="lodMaxZoomSlider" class="settings-panel__slider" min="1" max="11" step="1"
                  value="4" />
                <span id="lodMaxZoomLabel" class="settings-panel__value">4</span>
              </div>
            </div>
            <div class="settings-panel__row">
              <label for="lodTileRatioSlider">Tile Count Ratio</label>
              <div class="settings-panel__slider-group">
                <input type="range" id="lodTileRatioSlider" class="settings-panel__slider" min="1" max="10" step="0.5"
                  value="1" />
                <span id="lodTileRatioLabel" class="settings-panel__value">1.0</span>
              </div>
            </div>
          </div>
          <div class="settings-panel__section">
            <div class="settings-panel__section-title">Debug</div>
            <div class="settings-panel__row">
              <label for="debugModeToggle">Debug Mode</label>
              <input type="checkbox" id="debugModeToggle" class="settings-panel__checkbox" />
            </div>
            <div id="debugOptions" class="settings-panel__debug-options" aria-hidden="true">
              <div class="settings-panel__row">
                <label for="debugLayersToggle">Debug Tiles</label>
                <input type="checkbox" id="debugLayersToggle" class="settings-panel__checkbox" />
              </div>
              <div class="settings-panel__row">
                <label for="debugNetworkToggle">Network Visualization</label>
                <input type="checkbox" id="debugNetworkToggle" class="settings-panel__checkbox" />
              </div>
              <div class="settings-panel__row">
                <label for="debugShadowTunerToggle">Shadow Tuner</label>
                <input type="checkbox" id="debugShadowTunerToggle" class="settings-panel__checkbox" />
              </div>
              <div class="settings-panel__row">
                <label for="debugTileBordersToggle">Tile Borders</label>
                <input type="checkbox" id="debugTileBordersToggle" class="settings-panel__checkbox" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Analytical Legends (Aspect, Slope, Avalanche) -->
  <div id="analyticalLegendContainer" class="analytical-legend-container" aria-hidden="true"></div>

  <!-- Terrain Hover Info -->
  <div id="terrainHoverInfo" class="terrain-hover-info" aria-hidden="true"></div>



  <script type="module" src="./scripts/app/xploremap-app.js?v=20260430-sun-window-layer-1"></script>
</body>

</html>
